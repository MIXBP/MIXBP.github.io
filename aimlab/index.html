<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aim Master | MIXBP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #10131c; color: #e6e8ea; font-family: "Microsoft YaHei", Consolas, sans-serif;
           height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between;
             padding: 12px 24px; border-bottom: 1px solid #2a2d33; flex-shrink: 0; z-index: 10; }
    header .logo { font-weight: bold; color: #309E85; letter-spacing: 2px; }
    header a { color: #8b9096; text-decoration: none; font-size: 13px; }
    header a:hover { color: #309E85; }
    #hud { display: flex; gap: 26px; justify-content: center; padding: 10px;
           font-family: Consolas, monospace; font-size: 13px; color: #8b9096; flex-shrink: 0; z-index: 10; }
    #hud b { color: #e6e8ea; font-size: 17px; margin-left: 5px; }
    #hud .best b { color: #e6c07b; }
    #wrap { position: relative; flex: 1; margin: 0 20px 20px; }
    #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
             transform: translate(-50%, -50%); pointer-events: none; z-index: 3; display: none; }
    #cross::before, #cross::after { content: ''; position: absolute; background: #35c4ff;
             box-shadow: 0 0 4px rgba(53, 196, 255, .9); }
    #cross::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%);
             clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%, 0 62%, 100% 62%, 100% 100%, 0 100%); }
    #cross::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%);
             clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%, 62% 0, 100% 0, 100% 100%, 62% 100%); }
    #hitmark { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px;
             transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; z-index: 4;
             opacity: 0; }
    #hitmark span { position: absolute; background: #fff; box-shadow: 0 0 6px #35c4ff; }
    #hitmark span:nth-child(1) { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%);
             clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%, 0 70%, 100% 70%, 100% 100%, 0 100%); }
    #hitmark span:nth-child(2) { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    #hitmark.show { animation: hm .25s ease-out; }
    @keyframes hm { 0% { opacity: 1; transform: translate(-50%,-50%) rotate(45deg) scale(.7); }
                    100% { opacity: 0; transform: translate(-50%,-50%) rotate(45deg) scale(1.25); } }
    #pop { position: absolute; left: 50%; top: 56%; transform: translateX(-50%); z-index: 4;
           font-family: Consolas, monospace; font-size: 20px; font-weight: bold;
           color: #e6c07b; text-shadow: 0 0 8px rgba(230, 192, 123, .6);
           pointer-events: none; opacity: 0; }
    #pop.show { animation: popup .6s ease-out; }
    @keyframes popup { 0% { opacity: 1; transform: translateX(-50%) translateY(0); }
                       100% { opacity: 0; transform: translateX(-50%) translateY(-30px); } }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 12px; z-index: 5;
               background: rgba(16, 19, 28, .9); text-align: center; }
    #overlay h1 { font-size: 34px; letter-spacing: 5px; color: #309E85; }
    #overlay p { color: #8b9096; font-size: 14px; line-height: 1.9; }
    #overlay .keys { font-family: Consolas, monospace; color: #6a737d; font-size: 12px; }
    #overlay .stat { font-family: Consolas, monospace; font-size: 16px; color: #c9cdd1; }
    #overlay .stat b { color: #e6c07b; font-size: 26px; }
    .newbest { color: #e6c07b !important; }
    #startBtn { padding: 12px 46px; font-size: 16px; letter-spacing: 2px; margin-top: 4px;
             background: transparent; color: #309E85; border: 1px solid #309E85;
             border-radius: 4px; cursor: pointer; transition: all .2s; }
    #startBtn:hover { background: #309E85; color: #04140c; box-shadow: 0 0 18px rgba(48, 158, 133, .5); }
  </style>
</head>
<body>
  <header>
    <span class="logo">AIM MASTER</span>
    <a href="/">← 返回博客</a>
  </header>
  <div id="hud">
    <span>时间<b id="time">30.0</b>s</span>
    <span>得分<b id="score">0</b></span>
    <span>连击<b id="combo">0</b></span>
    <span>命中率<b id="acc">--</b></span>
    <span class="best">最高<b id="best">0</b></span>
  </div>
  <div id="wrap">
    <canvas id="c3d"></canvas>
    <div id="cross"></div>
    <div id="hitmark"><span></span><span></span></div>
    <div id="pop"></div>
    <div id="overlay">
      <h1>AIM MASTER</h1>
      <p>FPS 视角打靶 · 鼠标控制视角, 屏幕中心准星射击<br>能量球被击中即得分, 空点掉命中率 · 连击越高单发越值钱</p>
      <p class="keys">[ 鼠标 ] 转视角 &nbsp; [ 左键 ] 射击 &nbsp; [ ESC ] 暂停</p>
      <div class="stat">个人纪录 <b id="bestShow">0</b></div>
      <button id="startBtn">开始训练</button>
    </div>
  </div>
  <script src="/cdn/three/three.min.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('c3d');
      var overlay = document.getElementById('overlay');
      var cross = document.getElementById('cross');
      var hitmark = document.getElementById('hitmark');
      var popEl = document.getElementById('pop');
      var DURATION = 30, bestKey = 'aimlab_best', SENS = 0.0021;
      var running = false, paused = false, score = 0, hits = 0, misses = 0, combo = 0, maxCombo = 0, best = 0;
      var endAt = 0, remainMs = 0, timerId = null, targets = [];
      var yaw = 0, pitch = 0, locked = false;

      try { best = parseInt(localStorage.getItem(bestKey) || '0', 10) || 0; } catch (e) { }
      document.getElementById('best').textContent = best;
      document.getElementById('bestShow').textContent = best;

      /* ===== 场景: AimLab 风训练室 ===== */
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x171c26);
      scene.fog = new THREE.Fog(0x171c26, 18, 55);

      var camera = new THREE.PerspectiveCamera(70, 2, 0.1, 140);
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      function canvasTex(w, h, draw, rx, ry) {
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        draw(c.getContext('2d'), w, h);
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(rx || 1, ry || 1);
        return t;
      }

      /* 地板: 深蓝灰 + 网格线 */
      var floorMat = new THREE.MeshBasicMaterial({
        map: canvasTex(512, 512, function (g, w, h) {
          g.fillStyle = '#1e242e'; g.fillRect(0, 0, w, h);
          g.strokeStyle = '#273040'; g.lineWidth = 2;
          for (var i = 0; i <= 8; i++) {
            g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke();
            g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke();
          }
          g.strokeStyle = '#31405a'; g.lineWidth = 4;
          g.strokeRect(0, 0, w, h);
        }, 10, 10)
      });
      var floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -8;
      scene.add(floor);

      /* 天花板 */
      var ceilMat = new THREE.MeshBasicMaterial({
        map: canvasTex(256, 256, function (g, w, h) {
          g.fillStyle = '#161b24'; g.fillRect(0, 0, w, h);
          g.strokeStyle = '#20293a'; g.lineWidth = 2;
          for (var i = 0; i <= 4; i++) {
            g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke();
            g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke();
          }
        }, 12, 12)
      });
      var ceil = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), ceilMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.y = 10;
      scene.add(ceil);

      /* 墙面: 面板 + 竖缝 */
      function wallTex(rx, ry) {
        return canvasTex(512, 256, function (g, w, h) {
          g.fillStyle = '#232b38'; g.fillRect(0, 0, w, h);
          g.strokeStyle = '#2b3546'; g.lineWidth = 3;
          for (var i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); }
          g.strokeStyle = '#2028362';
          g.fillStyle = '#1c2330'; g.fillRect(0, 0, w, 26); g.fillRect(0, h - 26, w, 26);
          g.strokeStyle = '#2e3a4e'; g.lineWidth = 2;
          g.beginPath(); g.moveTo(0, 28); g.lineTo(w, 28); g.stroke();
          g.beginPath(); g.moveTo(0, h - 28); g.lineTo(w, h - 28); g.stroke();
        }, rx, ry);
      }
      var wallGeo = new THREE.PlaneGeometry(80, 18);
      var back = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ map: wallTex(8, 1) }));
      back.position.set(0, 1, -40);
      scene.add(back);
      var leftW = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ map: wallTex(8, 1) }));
      leftW.position.set(-40, 1, 0); leftW.rotation.y = Math.PI / 2;
      scene.add(leftW);
      var rightW = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ map: wallTex(8, 1) }));
      rightW.position.set(40, 1, 0); rightW.rotation.y = -Math.PI / 2;
      scene.add(rightW);
      var front = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ map: wallTex(8, 1) }));
      front.position.set(0, 1, 12); front.rotation.y = Math.PI;
      scene.add(front);

      /* 墙上光带 (青色发光条) */
      function lightStrip(x, z, rotY, w, hgt) {
        var s = new THREE.Mesh(new THREE.PlaneGeometry(w || 0.18, hgt || 9),
          new THREE.MeshBasicMaterial({ color: 0x63d8ff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
        s.position.set(x, 1.5, z);
        s.rotation.y = rotY;
        scene.add(s);
      }
      lightStrip(-39.8, -10, Math.PI / 2); lightStrip(-39.8, 6, Math.PI / 2);
      lightStrip(39.8, -10, -Math.PI / 2); lightStrip(39.8, 6, -Math.PI / 2);
      lightStrip(-12, -39.8, 0, 0.18, 9); lightStrip(12, -39.8, 0, 0.18, 9);

      /* 能量球: 白热核心 + 半透明蓝壳 + 光晕 */
      var glowTex = (function () {
        var c = document.createElement('canvas');
        c.width = c.height = 128;
        var g = c.getContext('2d');
        var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, 'rgba(190, 240, 255, .95)');
        gr.addColorStop(0.35, 'rgba(53, 196, 255, .4)');
        gr.addColorStop(1, 'rgba(53, 196, 255, 0)');
        g.fillStyle = gr;
        g.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      })();
      var coreGeo = new THREE.SphereGeometry(0.24, 18, 14);
      var shellGeo = new THREE.SphereGeometry(0.5, 24, 18);

      function spawnTarget() {
        var grp = new THREE.Group();
        var core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0xeaffff }));
        var shell = new THREE.Mesh(shellGeo, new THREE.MeshBasicMaterial({
          color: 0x35c4ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false
        }));
        var glow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85
        }));
        glow.scale.setScalar(2.4);
        grp.add(core); grp.add(shell); grp.add(glow);
        grp.position.set((Math.random() - 0.5) * 9, Math.random() * 3.5 - 0.8, -(9 + Math.random() * 6));
        grp.userData.born = performance.now();
        grp.userData.phase = Math.random() * Math.PI * 2;
        scene.add(grp);
        targets.push(grp);
      }

      var raycaster = new THREE.Raycaster();
      var clock = new THREE.Clock();

      function popTarget(grp) {
        var i = targets.indexOf(grp);
        if (i >= 0) targets.splice(i, 1);
        var t0 = performance.now();
        (function anim() {
          var k = (performance.now() - t0) / 260;
          if (k >= 1) { scene.remove(grp); return; }
          grp.scale.setScalar(1 + k * 1.0);
          grp.traverse(function (o) {
            if (o.material && o.material.opacity !== undefined) o.material.opacity = (o.material._baseOpacity === undefined ? (o.material._baseOpacity = o.material.opacity) : o.material._baseOpacity) * (1 - k);
          });
          requestAnimationFrame(anim);
        })();
      }

      /* 音效 (WebAudio 合成) */
      var AC = null;
      function audio() {
        if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
        if (AC && AC.state === 'suspended') AC.resume();
        return AC;
      }
      function beepHit() {
        var ac = audio(); if (!ac) return;
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(1300, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(1900, ac.currentTime + 0.07);
        g.gain.setValueAtTime(0.16, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 0.11);
      }
      function beepMiss() {
        var ac = audio(); if (!ac) return;
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(170, ac.currentTime);
        g.gain.setValueAtTime(0.07, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.09);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 0.1);
      }

      /* ===== 指针锁定 ===== */
      function requestLock() { if (canvas.requestPointerLock) canvas.requestPointerLock(); }
      document.addEventListener('pointerlockchange', function () {
        locked = document.pointerLockElement === canvas;
        if (!locked && running) pause();
      });
      document.addEventListener('mousemove', function (e) {
        if (!locked) return;
        yaw -= e.movementX * SENS;
        pitch -= e.movementY * SENS;
        pitch = Math.max(-1.2, Math.min(1.2, pitch));
      });
      document.addEventListener('mousedown', function (e) {
        if (!running || !locked || e.button !== 0) return;
        raycaster.setFromCamera({ x: 0, y: 0 }, camera);
        var hit = raycaster.intersectObjects(targets, true)[0];
        if (hit) {
          var grp = hit.object; while (grp && targets.indexOf(grp) === -1) grp = grp.parent;
          if (grp) {
            combo++; maxCombo = Math.max(maxCombo, combo);
            var dist = -grp.position.z;
            score += 10 + Math.min(combo, 20) + Math.round(Math.max(0, 14 - dist));
            hits++;
            popTarget(grp);
            beepHit();
            hitmark.classList.remove('show'); void hitmark.offsetWidth; hitmark.classList.add('show');
            popEl.textContent = '+' + (10 + Math.min(combo, 20));
            popEl.classList.remove('show'); void popEl.offsetWidth; popEl.classList.add('show');
            setTimeout(spawnTarget, 120);
          }
        } else {
          misses++; combo = 0;
          beepMiss();
        }
        upd();
      });

      /* ===== 主循环 ===== */
      function animate() {
        requestAnimationFrame(animate);
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
        var t = clock.getElapsedTime();
        for (var i = 0; i < targets.length; i++) {
          var m = targets[i];
          m.position.y += Math.sin(t * 1.4 + m.userData.phase) * 0.0016;
          var age = performance.now() - m.userData.born;
          if (age > 3400 && running) {
            scene.remove(m); targets.splice(i, 1); i--;
            spawnTarget();
          }
        }
        renderer.render(scene, camera);
      }

      function resize() {
        var w = document.getElementById('wrap').clientWidth, h = document.getElementById('wrap').clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
      window.addEventListener('resize', resize);
      resize();
      animate();

      /* ===== 流程 ===== */
      function upd() {
        document.getElementById('score').textContent = score;
        document.getElementById('combo').textContent = combo;
        var total = hits + misses;
        document.getElementById('acc').textContent = total ? Math.round(hits * 100 / total) + '%' : '--';
      }

      function clearTargets() {
        for (var i = 0; i < targets.length; i++) scene.remove(targets[i]);
        targets = [];
      }

      function start() {
        score = 0; hits = 0; misses = 0; combo = 0; maxCombo = 0; running = true; paused = false;
        clearTargets();
        for (var j = 0; j < 3; j++) spawnTarget();
        overlay.style.display = 'none';
        cross.style.display = 'block';
        upd();
        endAt = Date.now() + DURATION * 1000;
        timerId = setInterval(function () {
          var left = Math.max(0, (endAt - Date.now()) / 1000);
          document.getElementById('time').textContent = left.toFixed(1);
          if (left <= 0) stop();
        }, 100);
        requestLock();
      }

      function pause() {
        paused = true;
        remainMs = Math.max(0, endAt - Date.now());
        clearInterval(timerId);
        overlay.innerHTML = '<h1>已暂停</h1><p>鼠标已解锁 · 剩余 ' + (remainMs / 1000).toFixed(1) + 's</p>'
          + '<button id="resumeBtn">点击继续 (重新锁定鼠标)</button>';
        overlay.style.display = 'flex';
        cross.style.display = 'none';
        document.getElementById('resumeBtn').addEventListener('click', resume);
      }

      function resume() {
        paused = false;
        endAt = Date.now() + remainMs;
        overlay.style.display = 'none';
        cross.style.display = 'block';
        timerId = setInterval(function () {
          var left = Math.max(0, (endAt - Date.now()) / 1000);
          document.getElementById('time').textContent = left.toFixed(1);
          if (left <= 0) stop();
        }, 100);
        requestLock();
      }

      function stop() {
        running = false;
        clearInterval(timerId);
        clearTargets();
        if (document.pointerLockElement) document.exitPointerLock();
        cross.style.display = 'none';
        var total = hits + misses;
        var acc = total ? Math.round(hits * 100 / total) : 0;
        var isBest = score > best;
        if (isBest) {
          best = score;
          try { localStorage.setItem(bestKey, String(best)); } catch (e) { }
          document.getElementById('best').textContent = best;
        }
        overlay.innerHTML = '<h1>训练结束</h1>'
          + '<div class="stat">得分 <b class="' + (isBest ? 'newbest' : '') + '">' + score + '</b>' + (isBest ? ' 🏆 新纪录' : '') + '</div>'
          + '<p>命中 ' + hits + ' · 空点 ' + misses + ' · 命中率 ' + acc + '% · 最高连击 ' + maxCombo + '</p>'
          + '<p>历史纪录 ' + best + '</p>'
          + '<button id="startBtn">再来一局</button>';
        overlay.style.display = 'flex';
        document.getElementById('startBtn').addEventListener('click', start);
      }

      document.getElementById('startBtn').addEventListener('click', start);

      window.__aim = { scene: scene, camera: camera, THREE: THREE,
        setAim: function (dy, dp) { yaw += dy; pitch = Math.max(-1.2, Math.min(1.2, pitch + dp)); } };
    })();
  </script>
</body>
</html>
